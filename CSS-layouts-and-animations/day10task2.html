<html>
    
    <style>
    *{
        margin:0;
        box-sizing:border-box;
    }
    .container{
        height:500px;
        width:500px;
        gap:10px;
        display:grid;
         grid-template-rows:40px repeat(15,1fr) 40px;
         grid-template-rows:repeat(12, 1fr);
         font-size:12px;
         font-weight:bold;
         padding:5px;
         
}
       .box{
        background-color: pink;
        border:1px solid white;
       }
       .header{
        grid-column: 1/13;
        grid-row: 1/2;
        padding:5px;
        white-space:nowrap;
       }
       .sidebar{
          grid-column:1/4;
          grid-row:3/12;
       }     
       .nav{
         grid-column:1/13;
         grid-row:2/3;
      }
       .main{
         grid-column:4/13;
         grid-row:3/12;
       }
      .ads{
          grid-column:1/4;
          grid-row:12/13;
       }
      .footer{
        grid-column:4/13;
        grid-row:12/13;
      }
    </style>
  <body>
   <div class="container">
     <div class="box header">
        header (1 row, 12column)
        </div>
     <div class=" box sidebar">
        sidebar(10row,3 column)
     </div>
     <div class=" box nav">
        navigation(1row,6column)
     </div>
     <div class=" box ads">
        ads(10row,3 column)
     </div>
     <div class=" box main">
        main(9row,6column)
     </div>
     <div class=" box footer">
        footer(1row,12column)
      </div>
     </div>
   
  </body>
</html>
